apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginxRepls
  template:
    metadata:
      labels:
        app: nginxRepls
    spec:
      containers:
        - name: nginxreplicas
          image: nginx
          ports:
            - containerPort: 80
